schema_version: 1
profile: conference
study_profile: focused_24h
environment_policy: single_cuda_env
scope: focused_R_core_point_recovery_and_conditional_energy
# 24h is the runner's cumulative compute budget, not a completion guarantee.
# Conventional, locally trained and frozen pretrained point imputers.
sites: [H1, H2, I1]
folds: [1, 2, 3]
conditions: [C3, C4, C5]
methods: [median, locf, linear, seasonal, kalman_filter, kalman_smoother, SAITS, MOMENT-1-base]
require_available: [SAITS, MOMENT-1-base]
omission_reasons:
  BRITS: Deferred recurrent comparator after observed high per-fit cost; not selected by test accuracy.
  CSDI: Deferred diffusion and joint-sample extension; focused study evaluates point reconstruction.
  ImputeFormer: Deferred expanded locally trained comparison under the declared compute budget.
  T1: Deferred expanded locally trained comparison under the declared compute budget.
  TS-ICL: Deferred serial pretrained comparison under the declared compute budget.
  FIM: Outside focused scope; catalogue records unresolved checkpoint license separately.
  TabPFN-TS: Outside focused scope; catalogue records unresolved audited implementation separately.
  MoTM: Outside focused scope; catalogue records unresolved checkpoint bundle separately.
  CBiT: Outside focused scope; catalogue records unverified reproduction separately.
condition_omission_reasons:
  C1: Pointwise missingness is outside the primary contiguous communication-gap question.
  C2: Pointwise missingness is outside the primary contiguous communication-gap question.
  C6: Training-derived mixed gap patterns are deferred robustness experiments.
context: 512
training_stride: 288
max_training_windows: null
max_episodes: null
train_seeds: [11, 23, 47]
validation_mask_seeds: [1001, 1002, 1003, 1004, 1005]
test_mask_seeds: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010]
# Same declared native architecture (width 64), two learning rates: 1e-3/3e-4.
# Trial IDs refer to the fixed native six-candidate grids; not test ranking.
hpo_trials: 2
hpo_trial_indices: [0, 1]
hpo_max_epochs: 20
hpo_patience: 5
# Final fits keep three seeds, all chronological windows and the original ceiling.
max_epochs: 100
patience: 10
# Fixed metadata-only panel per site/fold, shared across trials/models/seeds.
# HPO candidate scoring, correction selection, final validation and test stay full.
epoch_validation_max_per_stratum: 20
epoch_validation_seed: 1729
batch_size: 32
inference_batch_size: 256
csdi_sample_batch_size: 32
brits_execution: vectorized
energy_cpu_workers: 8
energy_cpu_max_pending: 16
# Retained for custom profiles adding a probabilistic model; none selected here.
samples: 100
forecast_horizons_seconds: [1800, 3600, 10800, 21600]
physical_hypotheses: [instantaneous, interval_mean_start, interval_mean_end]
physical_conditions: [C3, C4, C5]
physical_confirmatory: false
bootstrap_attempts: 10000
block_days: 7
block_sensitivity_days: [2, 14]
shard_size: 16
